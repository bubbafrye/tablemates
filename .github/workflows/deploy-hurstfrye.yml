name: Deploy to hurstfrye.com

# Keeps GitHub Pages (deploy-pages.yml). Mirrors the same static export to
# https://hurstfrye.com/tablemates/ via FTP (Network Solutions / shared hosting).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hurstfrye-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          DEPLOY_SERVER: ${{ secrets.HURSTFRYE_FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.HURSTFRYE_FTP_USER }}
          DEPLOY_PASS: ${{ secrets.HURSTFRYE_FTP_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.HURSTFRYE_FTP_PATH }}
        run: |
          missing=
          [ -n "$DEPLOY_SERVER" ] || missing="$missing HURSTFRYE_FTP_SERVER"
          [ -n "$DEPLOY_USER" ] || missing="$missing HURSTFRYE_FTP_USER"
          [ -n "$DEPLOY_PASS" ] || missing="$missing HURSTFRYE_FTP_PASSWORD"
          [ -n "$DEPLOY_PATH" ] || missing="$missing HURSTFRYE_FTP_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing"
            echo "See docs/DEPLOY-HURSTFRYE.md (Network Solutions / FTP)"
            exit 1
          fi

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp zip

      # Fail fast if the `tablemates` FTP user/password/host is wrong.
      - name: FTP login smoke test
        env:
          FTP_SERVER: ${{ secrets.HURSTFRYE_FTP_SERVER }}
          FTP_USER: ${{ secrets.HURSTFRYE_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.HURSTFRYE_FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.HURSTFRYE_FTP_PATH }}
        run: |
          python3 -u .github/scripts/ns-ftp.py smoke
          printf 'ftp-ok\n' > tm-ftp-ok.txt
          python3 -u .github/scripts/ns-ftp.py put public/.htaccess tm-ftp-ok.txt
          echo "GET https://hurstfrye.com/tablemates/tm-ftp-ok.txt"
          curl -sS -D - --max-time 30 "https://hurstfrye.com/tablemates/tm-ftp-ok.txt" | head -n 40

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build tokens + static export
        run: |
          npm run tokens
          npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /tablemates
          PAGES_BASE_PATH: /tablemates
          NEXT_PUBLIC_PARTY_HOST: ${{ vars.NEXT_PUBLIC_PARTY_HOST }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      # One zip + unzip.php: Network Solutions PASV often dies mid multi-file mirror.
      - name: Deploy out/ via FTP (zip)
        env:
          FTP_SERVER: ${{ secrets.HURSTFRYE_FTP_SERVER }}
          FTP_USER: ${{ secrets.HURSTFRYE_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.HURSTFRYE_FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.HURSTFRYE_FTP_PATH }}
        run: |
          TOKEN=$(openssl rand -hex 16)
          echo "$TOKEN" > /tmp/deploy-token
          ( cd out && zip -r -q ../tablemates-out.zip . )
          cat > unzip-tablemates.php <<PHP
          <?php
          if (!hash_equals('${TOKEN}', \$_GET['t'] ?? '')) { http_response_code(403); exit('forbidden'); }
          \$zip = new ZipArchive();
          if (\$zip->open(__DIR__ . '/tablemates-out.zip') !== true) { http_response_code(500); exit('zip open failed'); }
          \$zip->extractTo(__DIR__);
          \$zip->close();
          @unlink(__DIR__ . '/tablemates-out.zip');
          @unlink(__FILE__);
          echo 'ok';
          PHP
          ls -lh tablemates-out.zip unzip-tablemates.php
          python3 -u .github/scripts/ns-ftp.py put tablemates-out.zip unzip-tablemates.php
          echo "UNZIP_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Unzip on host
        env:
          TOKEN: ${{ env.UNZIP_TOKEN }}
        run: |
          ok=
          for url in \
            "https://hurstfrye.com/tablemates/unzip-tablemates.php?t=${TOKEN}" \
            "https://hurstfrye.com/Tablemates/unzip-tablemates.php?t=${TOKEN}"
          do
            echo "GET $url"
            body=$(curl -sS -w "\nHTTP:%{http_code}" --max-time 120 "$url" || true)
            echo "$body"
            echo "$body" | grep -q '^ok' && { ok=1; break; }
          done
          if [ -z "$ok" ]; then
            echo "::error::Uploaded zip, but unzip.php did not run. Unzip tablemates-out.zip in Network Solutions File Manager."
            exit 1
          fi
          curl -sS "https://hurstfrye.com/tablemates/index.html" | head -c 400


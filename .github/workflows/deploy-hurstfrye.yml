name: Deploy to hurstfrye.com

# Keeps GitHub Pages (deploy-pages.yml). Mirrors the same static export to
# https://hurstfrye.com/tablemates/ via FTP (Network Solutions / shared hosting).
# FTP user `tablemates` is jailed to PUBLIC_HTML/TABLEMATES — upload into `.`.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hurstfrye-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          DEPLOY_SERVER: ${{ secrets.HURSTFRYE_FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.HURSTFRYE_FTP_USER }}
          DEPLOY_PASS: ${{ secrets.HURSTFRYE_FTP_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.HURSTFRYE_FTP_PATH }}
        run: |
          missing=
          [ -n "$DEPLOY_SERVER" ] || missing="$missing HURSTFRYE_FTP_SERVER"
          [ -n "$DEPLOY_USER" ] || missing="$missing HURSTFRYE_FTP_USER"
          [ -n "$DEPLOY_PASS" ] || missing="$missing HURSTFRYE_FTP_PASSWORD"
          [ -n "$DEPLOY_PATH" ] || missing="$missing HURSTFRYE_FTP_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing"
            echo "See docs/DEPLOY-HURSTFRYE.md (Network Solutions / FTP)"
            exit 1
          fi

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: FTP login smoke test
        env:
          FTP_SERVER: ${{ secrets.HURSTFRYE_FTP_SERVER }}
          FTP_USER: ${{ secrets.HURSTFRYE_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.HURSTFRYE_FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.HURSTFRYE_FTP_PATH }}
        run: |
          python3 -u .github/scripts/ns-ftp.py smoke
          printf '<p>html-ok</p>\n' > tm-ok.html
          python3 -u .github/scripts/ns-ftp.py put tm-ok.html
          body=$(curl -sS --max-time 30 "https://hurstfrye.com/tablemates/tm-ok.html")
          echo "$body"
          echo "$body" | grep -q html-ok || {
            echo "::error::Jail-root HTML is not served at /tablemates/tm-ok.html"
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build tokens + static export
        run: |
          npm run tokens
          npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /tablemates
          PAGES_BASE_PATH: /tablemates
          NEXT_PUBLIC_PARTY_HOST: ${{ vars.NEXT_PUBLIC_PARTY_HOST }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      - name: Deploy out/ via FTP
        env:
          FTP_SERVER: ${{ secrets.HURSTFRYE_FTP_SERVER }}
          FTP_USER: ${{ secrets.HURSTFRYE_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.HURSTFRYE_FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.HURSTFRYE_FTP_PATH }}
        run: |
          python3 -u .github/scripts/ns-ftp.py put out/index.html out/404.html
          python3 -u .github/scripts/ns-ftp.py mirror ./out

      - name: Verify live index
        run: |
          body=$(curl -sS --max-time 30 "https://hurstfrye.com/tablemates/index.html")
          echo "$body" | head -c 500
          echo
          echo "$body" | grep -qi 'Portfolio' && {
            echo "::error::Live index.html is still the Portfolio SPA."
            exit 1
          }
          echo "$body" | grep -q '_next' || {
            echo "::error::Live index.html is not the Next export (missing _next)."
            exit 1
          }
